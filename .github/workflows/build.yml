name: Track Arch GTK and test live CSS

# This fork maintains and tests the recipe. MainstreamOS/packages builds and
# signs the shipping package; this workflow never publishes an unsigned repo.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: build even if Arch's stable GTK has not changed
        type: boolean
        default: false
  push:
    branches: [mainstream]
    paths:
      - PKGBUILD
      - '*-css-live-reload.patch'
      - '*.py'
      - '*.sh'
      - '*.hook'
      - '*.script'
      - upstream-version
      - tests/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: gtk4-live-css-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare tools
        run: pacman -Syu --noconfirm --needed git python sudo xorg-server-xvfb xorg-xauth dbus

      - uses: actions/checkout@v6

      - name: Refresh from Arch stable
        id: recipe
        run: |
          python3 prepare-upstream.py latest
          changed=false
          git diff --quiet || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Create build user
        if: steps.recipe.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir out
          chown builder:builder out

      - name: Build Arch-compatible package
        if: steps.recipe.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: |
          runuser -u builder -- env PKGDEST="$GITHUB_WORKSPACE/out" \
            makepkg -sf --noconfirm

      - name: Test live GTK and libadwaita windows
        if: steps.recipe.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          pacman -S --needed --noconfirm python-gobject libadwaita
          runuser -u builder -- dbus-run-session -- xvfb-run -a \
            python3 tests/live-css.py --library-dir src/build/gtk
          runuser -u builder -- dbus-run-session -- xvfb-run -a \
            python3 tests/live-css.py --library-dir src/build/gtk --adwaita

      - uses: actions/upload-artifact@v4
        if: steps.recipe.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        with:
          name: gtk4-live-css-test-build
          path: out/gtk4-live-css-*.pkg.tar.zst
          if-no-files-found: error

      - name: Record tested Arch recipe
        if: steps.recipe.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD upstream-version *.hook *.script
          git diff --cached --quiet && exit 0
          git commit -m "gtk4: track tested Arch stable recipe"
          git push origin "HEAD:$TARGET_BRANCH"
